name: Publish site

# Runs on a schedule (04:00 Europe/Kyiv) or when manually triggered from the
# Actions tab ("Run workflow" — the "publish" button). Never runs on push,
# so editing content on `main` does not by itself trigger a rebuild.
on:
  schedule:
    # GitHub Actions cron runs in UTC, so one daily trigger near the DST shift is
    # enough: 02:00 UTC = 04:00 Kyiv in winter and 05:00 Kyiv in summer.
    - cron: "0 2 * * *" # 04:00/05:00 Kyiv time (winter/summer)
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: vault

      - name: Checkout site code
        uses: actions/checkout@v4
        with:
          ref: site
          path: site

      - name: Sync content into site
        run: |
          rm -rf site/src/data/posts site/src/data/reviews site/src/data/assets
          mkdir -p site/src/data
          cp -r vault/content/posts site/src/data/posts
          cp -r vault/content/reviews site/src/data/reviews
          cp -r vault/content/assets site/src/data/assets

      # Astro 7 requires Node >=22.23.4; the `astro` binary runs on the system
      # Node via its shebang, so pin the major version instead of relying on
      # whatever the runner image ships.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Incremental build cache (manifest + copies of rendered OG/preview images).
      # Unique key per run + prefix restore-keys: each run restores the latest
      # previous cache and saves a new entry (only on success). Astro itself
      # invalidates the cache when the config or lockfile changes.
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: site/node_modules/.astro
          key: astro-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            astro-build-${{ runner.os }}-

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Deploy runs as its own job (GitHub's starter-workflow layout) instead of
  # right after the upload in `build`. deploy-pages looks the artifact up
  # through a backend that can lag the upload by a moment; called ~0.3 s after
  # upload-pages-artifact it intermittently got "Found 0 artifact(s)" /
  # "No artifacts named github-pages" (actions/deploy-pages#451). Starting a
  # new job gives it time, and one delayed retry covers the rest.
  #
  # Keeping deploy out of `build` also lets the build job succeed on its own,
  # so the Astro cache's post step actually saves the cache.
  #
  # Don't fix a failed deploy with "Re-run failed jobs" on `build`: that uploads
  # a second github-pages artifact to the run and deploy then fails with
  # "Multiple artifacts". Re-run only `deploy`, or start a new run.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
