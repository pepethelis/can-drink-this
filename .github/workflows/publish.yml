name: Publish site

# Runs on a schedule (04:00 Europe/Kyiv) or when manually triggered from the
# Actions tab ("Run workflow" — the "publish" button). Never runs on push,
# so editing content on `main` does not by itself trigger a rebuild.
on:
  schedule:
    # GitHub Actions cron runs in UTC, so one daily trigger near the DST shift is
    # enough: 02:00 UTC = 04:00 Kyiv in winter and 05:00 Kyiv in summer.
    - cron: "0 2 * * *" # 04:00/05:00 Kyiv time (winter/summer)
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout content (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: vault

      - name: Checkout site code
        uses: actions/checkout@v4
        with:
          ref: site
          path: site

      - name: Sync content into site
        run: |
          rm -rf site/src/data/posts site/src/data/reviews site/src/data/assets
          mkdir -p site/src/data
          cp -r vault/content/posts site/src/data/posts
          cp -r vault/content/reviews site/src/data/reviews
          cp -r vault/content/assets site/src/data/assets

      # Astro 7 requires Node >=22.23.4; the `astro` binary runs on the system
      # Node via its shebang, so pin the major version instead of relying on
      # whatever the runner image ships.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Incremental build cache (manifest + copies of rendered OG/preview images).
      # Unique key per run + prefix restore-keys: each run restores the latest
      # previous cache and saves a new entry (only on success). Astro itself
      # invalidates the cache when the config or lockfile changes.
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: site/node_modules/.astro
          key: astro-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            astro-build-${{ runner.os }}-

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
